<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8E%AE%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#0f1220">
<title>Rock Paper Scissors — Arcade Hub</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  .rps-row { display:flex; justify-content:center; gap:20px; margin: 24px 0; }
  .rps-btn {
    width: 84px; height: 84px; border-radius: 50%;
    background: var(--card); border: 1px solid rgba(255,255,255,0.1);
    font-size: 2.2rem; cursor: pointer; display:flex; align-items:center; justify-content:center;
    transition: transform 0.12s ease, background 0.12s ease;
  }
  .rps-btn:hover { transform: translateY(-4px); background: var(--card-hover); }
  .rps-versus { display:flex; justify-content:center; align-items:center; gap:30px; margin: 20px 0; }
  .rps-slot { font-size: 3.6rem; width: 90px; height: 90px; display:flex; align-items:center; justify-content:center;
    background: var(--bg-alt); border-radius: 16px; border: 1px solid rgba(255,255,255,0.08);
    transition: border-color 0.2s ease, box-shadow 0.2s ease; }
  .rps-vs-label { color: var(--text-dim); font-weight: 800; }
  .streak { font-weight:800; }

  .rps-slot.shuffling { animation: rps-shuffle 0.09s linear infinite; }
  @keyframes rps-shuffle {
    0% { transform: scale(1) rotate(0deg); }
    50% { transform: scale(0.88) rotate(-6deg); }
    100% { transform: scale(1) rotate(0deg); }
  }
  .rps-slot.reveal { animation: rps-reveal 0.4s cubic-bezier(.34,1.56,.64,1); }
  @keyframes rps-reveal {
    0% { transform: scale(0.3) rotate(-20deg); opacity: 0.4; }
    60% { transform: scale(1.15) rotate(8deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg); }
  }
  .rps-slot.win { border-color: var(--good); box-shadow: 0 0 22px rgba(74, 222, 128, 0.45); }
  .rps-slot.lose { border-color: var(--bad); box-shadow: 0 0 22px rgba(248, 113, 113, 0.35); }
  .rps-btn:disabled { opacity: 0.5; cursor: default; pointer-events: none; }
</style>
</head>
<body>

<header class="site-header">
  <div class="brand"><span class="dot"></span> Arcade Hub</div>
  <a class="home-link" href="../index.html">← All games</a>
</header>

<div class="game-wrap">
  <h1>✊ Rock Paper Scissors</h1>
  <p class="hint">Click a hand, or press 1 (rock) / 2 (paper) / 3 (scissors)</p>

  <div class="hud">
    <div class="pill">Wins <span id="wins">0</span></div>
    <div class="pill">Losses <span id="losses">0</span></div>
    <div class="pill">Draws <span id="draws">0</span></div>
    <div class="pill">Streak <span id="streak">0</span></div>
  </div>

  <div class="stage">
    <div class="rps-versus">
      <div class="rps-slot" id="youSlot">❔</div>
      <div class="rps-vs-label">VS</div>
      <div class="rps-slot" id="cpuSlot">❔</div>
    </div>
    <div class="rps-row">
      <button class="rps-btn" data-choice="rock">✊</button>
      <button class="rps-btn" data-choice="paper">✋</button>
      <button class="rps-btn" data-choice="scissors">✌️</button>
    </div>
  </div>

  <div class="overlay-msg" id="msg">Make your move!</div>
</div>

<script>
const youSlot = document.getElementById('youSlot');
const cpuSlot = document.getElementById('cpuSlot');
const msgEl = document.getElementById('msg');
const winsEl = document.getElementById('wins');
const lossesEl = document.getElementById('losses');
const drawsEl = document.getElementById('draws');
const streakEl = document.getElementById('streak');

const EMOJI = { rock: '✊', paper: '✋', scissors: '✌️' };
const BEATS = { rock: 'scissors', paper: 'rock', scissors: 'paper' };

let stats = JSON.parse(localStorage.getItem('rps-stats') || '{"wins":0,"losses":0,"draws":0,"streak":0}');
render();

function render() {
  winsEl.textContent = stats.wins;
  lossesEl.textContent = stats.losses;
  drawsEl.textContent = stats.draws;
  streakEl.textContent = stats.streak;
  localStorage.setItem('rps-stats', JSON.stringify(stats));
}

const options = ['rock', 'paper', 'scissors'];
const btns = document.querySelectorAll('.rps-btn');
let busy = false;

function setBtnsDisabled(disabled) {
  btns.forEach(b => b.disabled = disabled);
}

function play(choice) {
  if (busy) return;
  busy = true;
  setBtnsDisabled(true);
  msgEl.textContent = '';
  msgEl.className = 'overlay-msg';
  youSlot.className = 'rps-slot shuffling';
  cpuSlot.className = 'rps-slot shuffling';

  const shuffleTimer = setInterval(() => {
    youSlot.textContent = EMOJI[options[Math.floor(Math.random() * 3)]];
    cpuSlot.textContent = EMOJI[options[Math.floor(Math.random() * 3)]];
  }, 70);

  setTimeout(() => {
    clearInterval(shuffleTimer);
    const cpu = options[Math.floor(Math.random() * 3)];
    youSlot.textContent = EMOJI[choice];
    cpuSlot.textContent = EMOJI[cpu];

    let youCls = 'rps-slot reveal', cpuCls = 'rps-slot reveal';
    if (choice === cpu) {
      stats.draws++;
      stats.streak = 0;
      msgEl.textContent = `Both picked ${choice} — draw!`;
      msgEl.className = 'overlay-msg';
    } else if (BEATS[choice] === cpu) {
      stats.wins++;
      stats.streak++;
      msgEl.textContent = `${choice} beats ${cpu} — you win! 🎉`;
      msgEl.className = 'overlay-msg good';
      youCls += ' win'; cpuCls += ' lose';
    } else {
      stats.losses++;
      stats.streak = 0;
      msgEl.textContent = `${cpu} beats ${choice} — you lose.`;
      msgEl.className = 'overlay-msg bad';
      youCls += ' lose'; cpuCls += ' win';
    }
    youSlot.className = youCls;
    cpuSlot.className = cpuCls;
    render();
    busy = false;
    setBtnsDisabled(false);
  }, 550);
}

btns.forEach(b => {
  b.addEventListener('click', () => play(b.dataset.choice));
});

document.addEventListener('keydown', e => {
  const map = { '1': 'rock', '2': 'paper', '3': 'scissors' };
  if (map[e.key]) play(map[e.key]);
});
</script>
</body>
</html>
