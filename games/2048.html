<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8E%AE%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#0f1220">
<title>2048 — Arcade Hub</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  .g2048-board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 10px;
    width: min(90vw, 420px);
    height: min(90vw, 420px);
    background: #0b0e1c;
    padding: 10px;
    border-radius: 10px;
  }
  .g2048-cell {
    border-radius: 8px;
    background: rgba(255,255,255,0.06);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: clamp(1rem, 4.5vw, 1.8rem);
    transition: background 0.15s ease, transform 0.1s ease;
    color: #1a1a1a;
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="brand"><span class="dot"></span> Arcade Hub</div>
  <a class="home-link" href="../index.html">← All games</a>
</header>

<div class="game-wrap">
  <h1>🔢 2048</h1>
  <p class="hint">Arrow keys / WASD on PC · Swipe on mobile</p>

  <div class="hud">
    <div class="pill">Score <span id="score">0</span></div>
    <div class="pill">Best <span id="best">0</span></div>
  </div>

  <div class="stage">
    <div class="g2048-board" id="board"></div>
  </div>

  <div class="overlay-msg" id="msg"></div>
  <div style="margin-top:14px;">
    <button class="btn" id="restartBtn">New Game</button>
  </div>
</div>

<script>
const boardEl = document.getElementById('board');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const msgEl = document.getElementById('msg');
const restartBtn = document.getElementById('restartBtn');

const COLORS = {
  0: 'rgba(255,255,255,0.06)', 2: '#eef0ff', 4: '#e0e7ff', 8: '#c7b2ff',
  16: '#a78bfa', 32: '#8b5cf6', 64: '#7c3aed', 128: '#22d3ee', 256: '#0ea5e9',
  512: '#f472b6', 1024: '#fb7185', 2048: '#f59e0b'
};

let grid, score, best = Number(localStorage.getItem('2048-best') || 0), over = false;
bestEl.textContent = best;

function emptyGrid() { return Array.from({length:4}, () => [0,0,0,0]); }

function reset() {
  grid = emptyGrid();
  score = 0;
  over = false;
  msgEl.textContent = '';
  msgEl.className = 'overlay-msg';
  addTile(); addTile();
  render();
}

function addTile() {
  const empties = [];
  for (let r=0;r<4;r++) for (let c=0;c<4;c++) if (grid[r][c]===0) empties.push([r,c]);
  if (!empties.length) return;
  const [r,c] = empties[Math.floor(Math.random()*empties.length)];
  grid[r][c] = Math.random() < 0.9 ? 2 : 4;
}

function render() {
  boardEl.innerHTML = '';
  for (let r=0;r<4;r++) for (let c=0;c<4;c++) {
    const v = grid[r][c];
    const d = document.createElement('div');
    d.className = 'g2048-cell';
    d.style.background = COLORS[v] || '#f59e0b';
    d.style.color = v <= 4 ? '#3a3a4a' : '#fff';
    d.textContent = v || '';
    boardEl.appendChild(d);
  }
  scoreEl.textContent = score;
}

function slideRow(row) {
  const nums = row.filter(v => v !== 0);
  const merged = [];
  let moved = nums.length !== row.length;
  for (let i=0;i<nums.length;i++) {
    if (nums[i] === nums[i+1]) {
      merged.push(nums[i]*2);
      score += nums[i]*2;
      i++;
      moved = true;
    } else {
      merged.push(nums[i]);
    }
  }
  while (merged.length < 4) merged.push(0);
  for (let i=0;i<4;i++) if (merged[i] !== row[i]) moved = true;
  return { row: merged, moved };
}

function rotateGrid(g) {
  const n = emptyGrid();
  for (let r=0;r<4;r++) for (let c=0;c<4;c++) n[c][3-r] = g[r][c];
  return n;
}

function move(dir) {
  if (over) return;
  let moved = false;
  let g = grid;
  let rotations = { left: 0, up: 3, right: 2, down: 1 }[dir];
  for (let i=0;i<rotations;i++) g = rotateGrid(g);

  for (let r=0;r<4;r++) {
    const { row, moved: m } = slideRow(g[r]);
    g[r] = row;
    if (m) moved = true;
  }

  for (let i=0;i<(4-rotations)%4;i++) g = rotateGrid(g);
  grid = g;

  if (moved) {
    addTile();
    render();
    checkGameOver();
    if (score > best) { best = score; localStorage.setItem('2048-best', best); bestEl.textContent = best; }
  }
}

function canMoveAnywhere() {
  for (let r=0;r<4;r++) for (let c=0;c<4;c++) {
    if (grid[r][c] === 0) return true;
    if (c<3 && grid[r][c] === grid[r][c+1]) return true;
    if (r<3 && grid[r][c] === grid[r+1][c]) return true;
  }
  return false;
}

function checkGameOver() {
  for (let r=0;r<4;r++) for (let c=0;c<4;c++) if (grid[r][c] === 2048) {
    msgEl.textContent = 'You reached 2048! 🎉 Keep going or restart.';
    msgEl.className = 'overlay-msg good';
  }
  if (!canMoveAnywhere()) {
    over = true;
    msgEl.textContent = 'Game Over — tap New Game';
    msgEl.className = 'overlay-msg bad';
  }
}

document.addEventListener('keydown', e => {
  const map = { ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right', w:'up', s:'down', a:'left', d:'right' };
  if (map[e.key]) { move(map[e.key]); e.preventDefault(); }
});

let touchStart = null;
boardEl.addEventListener('touchstart', e => { touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY }; }, { passive: true });
boardEl.addEventListener('touchend', e => {
  if (!touchStart) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) > 20) {
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 'right' : 'left');
    else move(dy > 0 ? 'down' : 'up');
  }
  touchStart = null;
});

restartBtn.addEventListener('click', reset);
reset();
</script>
</body>
</html>
