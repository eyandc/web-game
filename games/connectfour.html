<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8E%AE%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#0f1220">
<title>Connect Four — Arcade Hub</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  .c4-board {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    background: #1746a2;
    padding: 8px;
    border-radius: 10px;
    width: min(calc(100vw - 64px), 490px);
    position: relative;
    overflow: hidden;
  }
  .c4-cell {
    aspect-ratio: 1;
    border-radius: 50%;
    background: #0b0e1c;
    cursor: pointer;
    position: relative;
  }
  .c4-cell.x { background: #f59e0b; }
  .c4-cell.o { background: #f472b6; }
  .c4-cell.win { animation: c4-win-pulse 0.7s ease-in-out infinite; }
  @keyframes c4-win-pulse {
    0%, 100% { box-shadow: 0 0 0 3px #4ade80 inset; }
    50% { box-shadow: 0 0 0 3px #4ade80 inset, 0 0 16px 4px rgba(74,222,128,0.7); }
  }
  .c4-cell.drop { animation: c4-drop 0.45s cubic-bezier(.5,0,.75,1); }
  @keyframes c4-drop {
    0% { transform: translateY(calc(var(--fall, 1) * -100% - var(--fall, 1) * 6px)); }
    75% { transform: translateY(4%); }
    100% { transform: translateY(0); }
  }
  .mode-row { display:flex; justify-content:center; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
  .c4-ripple {
    position: absolute;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: rgba(255,255,255,0.5);
    transform: translate(-50%, -50%) scale(0);
    pointer-events: none;
    animation: c4-ripple-out 0.5s ease-out forwards;
  }
  @keyframes c4-ripple-out {
    to { transform: translate(-50%, -50%) scale(9); opacity: 0; }
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="brand"><span class="dot"></span> Arcade Hub</div>
  <a class="home-link" href="../index.html">← All games</a>
</header>

<div class="game-wrap">
  <h1>🔴 Connect Four</h1>
  <p class="hint">Tap a column to drop your piece — get 4 in a row</p>

  <div class="mode-row">
    <button class="btn secondary" id="modeAI">Vs Computer</button>
    <button class="btn secondary" id="mode2P">2 Players</button>
  </div>

  <div class="hud">
    <div class="pill">Wins <span id="wins">0</span></div>
    <div class="pill">Losses <span id="losses">0</span></div>
    <div class="pill">Draws <span id="draws">0</span></div>
  </div>

  <div class="stage">
    <div class="c4-board" id="board"></div>
  </div>

  <div class="overlay-msg" id="msg"></div>
  <div style="margin-top:14px;">
    <button class="btn" id="restartBtn">Restart Round</button>
  </div>
</div>

<script>
const ROWS = 6, COLS = 7;
const boardEl = document.getElementById('board');
const msgEl = document.getElementById('msg');
const restartBtn = document.getElementById('restartBtn');
const modeAIBtn = document.getElementById('modeAI');
const mode2PBtn = document.getElementById('mode2P');
const winsEl = document.getElementById('wins');
const lossesEl = document.getElementById('losses');
const drawsEl = document.getElementById('draws');

let vsAI = true;
let grid, turn, over;
let stats = JSON.parse(localStorage.getItem('c4-stats') || '{"wins":0,"losses":0,"draws":0}');
updateStats();

function updateStats() {
  winsEl.textContent = stats.wins;
  lossesEl.textContent = stats.losses;
  drawsEl.textContent = stats.draws;
  localStorage.setItem('c4-stats', JSON.stringify(stats));
}

function reset() {
  grid = Array.from({length: ROWS}, () => Array(COLS).fill(''));
  turn = 'X';
  over = false;
  msgEl.textContent = vsAI ? 'Your turn (orange)' : "Player orange's turn";
  msgEl.className = 'overlay-msg';
  render();
}

function render(winCells, dropCell) {
  boardEl.innerHTML = '';
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const d = document.createElement('div');
      const v = grid[r][c];
      d.className = 'c4-cell' + (v === 'X' ? ' x' : v === 'O' ? ' o' : '');
      if (winCells && winCells.some(([wr,wc]) => wr===r && wc===c)) d.classList.add('win');
      if (dropCell && dropCell.r === r && dropCell.c === c) {
        d.classList.add('drop');
        d.style.setProperty('--fall', r + 1);
      }
      d.addEventListener('click', e => { spawnRipple(e); handleMove(c); });
      boardEl.appendChild(d);
    }
  }
}

function spawnRipple(e) {
  const rect = boardEl.getBoundingClientRect();
  const ripple = document.createElement('div');
  ripple.className = 'c4-ripple';
  ripple.style.left = (e.clientX - rect.left) + 'px';
  ripple.style.top = (e.clientY - rect.top) + 'px';
  boardEl.appendChild(ripple);
  ripple.addEventListener('animationend', () => ripple.remove());
}

function lowestEmptyRow(c) {
  for (let r = ROWS - 1; r >= 0; r--) if (!grid[r][c]) return r;
  return -1;
}

function handleMove(c) {
  if (over) return;
  if (vsAI && turn === 'O') return;
  const r = lowestEmptyRow(c);
  if (r === -1) return;
  grid[r][c] = turn;
  const result = checkWin(grid, r, c, turn);
  render(null, { r, c });
  if (result) return endGame(result, turn);

  turn = turn === 'X' ? 'O' : 'X';
  msgEl.textContent = vsAI ? 'Computer thinking…' : `Player ${turn === 'X' ? 'orange' : 'pink'}'s turn`;

  if (vsAI && turn === 'O' && !over) {
    setTimeout(() => {
      const col = bestAIMove();
      const rr = lowestEmptyRow(col);
      if (rr === -1) return;
      grid[rr][col] = 'O';
      const res2 = checkWin(grid, rr, col, 'O');
      render(null, { r: rr, c: col });
      if (res2) return endGame(res2, 'O');
      turn = 'X';
      msgEl.textContent = 'Your turn (orange)';
    }, 400);
  }
}

function checkWin(g, r, c, player) {
  const dirs = [[0,1],[1,0],[1,1],[1,-1]];
  for (const [dr, dc] of dirs) {
    const cells = [[r,c]];
    for (let s = 1; s < 4; s++) {
      const rr = r + dr*s, cc = c + dc*s;
      if (rr>=0 && rr<ROWS && cc>=0 && cc<COLS && g[rr][cc] === player) cells.push([rr,cc]); else break;
    }
    for (let s = 1; s < 4; s++) {
      const rr = r - dr*s, cc = c - dc*s;
      if (rr>=0 && rr<ROWS && cc>=0 && cc<COLS && g[rr][cc] === player) cells.push([rr,cc]); else break;
    }
    if (cells.length >= 4) return cells;
  }
  if (g.every(row => row.every(v => v))) return 'draw';
  return null;
}

function endGame(result, player) {
  over = true;
  if (result === 'draw') {
    msgEl.textContent = "It's a draw!";
    msgEl.className = 'overlay-msg';
    stats.draws++;
  } else {
    render(result);
    if (vsAI) {
      if (player === 'X') { msgEl.textContent = 'You win! 🎉'; msgEl.className = 'overlay-msg good'; stats.wins++; }
      else { msgEl.textContent = 'Computer wins.'; msgEl.className = 'overlay-msg bad'; stats.losses++; }
    } else {
      msgEl.textContent = `Player ${player === 'X' ? 'orange' : 'pink'} wins! 🎉`;
      msgEl.className = 'overlay-msg good';
      stats.wins++;
    }
  }
  updateStats();
}

function validCols() {
  const cols = [];
  for (let c = 0; c < COLS; c++) if (lowestEmptyRow(c) !== -1) cols.push(c);
  return cols;
}

function bestAIMove() {
  const cols = validCols();
  // 1) win if possible
  for (const c of cols) {
    const r = lowestEmptyRow(c);
    grid[r][c] = 'O';
    const win = checkWin(grid, r, c, 'O');
    grid[r][c] = '';
    if (win && win !== 'draw') return c;
  }
  // 2) block opponent win
  for (const c of cols) {
    const r = lowestEmptyRow(c);
    grid[r][c] = 'X';
    const win = checkWin(grid, r, c, 'X');
    grid[r][c] = '';
    if (win && win !== 'draw') return c;
  }
  // 3) prefer center columns
  const centerOrder = [3,2,4,1,5,0,6].filter(c => cols.includes(c));
  return centerOrder[0];
}

modeAIBtn.addEventListener('click', () => { vsAI = true; modeAIBtn.classList.remove('secondary'); mode2PBtn.classList.add('secondary'); reset(); });
mode2PBtn.addEventListener('click', () => { vsAI = false; mode2PBtn.classList.remove('secondary'); modeAIBtn.classList.add('secondary'); reset(); });
restartBtn.addEventListener('click', reset);

modeAIBtn.classList.remove('secondary');
reset();
</script>
</body>
</html>
