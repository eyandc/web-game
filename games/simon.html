<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8E%AE%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#0f1220">
<title>Simon Says — Arcade Hub</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  .simon-board {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 10px;
    width: min(80vw, 320px);
    height: min(80vw, 320px);
  }
  .simon-pad {
    border-radius: 16px;
    cursor: pointer;
    opacity: 0.55;
    transition: opacity 0.1s ease, transform 0.1s ease;
  }
  .simon-pad.active { opacity: 1; transform: scale(0.97); box-shadow: 0 0 30px currentColor; }
  #pad0 { background: #f87171; color: #f87171; border-radius: 16px 4px 4px 4px; }
  #pad1 { background: #4ade80; color: #4ade80; border-radius: 4px 16px 4px 4px; }
  #pad2 { background: #facc15; color: #facc15; border-radius: 4px 4px 4px 16px; }
  #pad3 { background: #60a5fa; color: #60a5fa; border-radius: 4px 4px 16px 4px; }
  .simon-center {
    text-align:center; font-weight:800; font-size:1.1rem; margin: 16px 0 6px;
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="brand"><span class="dot"></span> Arcade Hub</div>
  <a class="home-link" href="../index.html">← All games</a>
</header>

<div class="game-wrap">
  <h1>🎵 Simon Says</h1>
  <p class="hint">Watch the pattern, then repeat it — tap the pads or press 1-4</p>

  <div class="hud">
    <div class="pill">Round <span id="round">0</span></div>
    <div class="pill">Best <span id="best">0</span></div>
  </div>

  <div class="stage">
    <div class="simon-board" id="board">
      <div class="simon-pad" id="pad0" data-i="0"></div>
      <div class="simon-pad" id="pad1" data-i="1"></div>
      <div class="simon-pad" id="pad2" data-i="2"></div>
      <div class="simon-pad" id="pad3" data-i="3"></div>
    </div>
    <div class="simon-center" id="center">Tap Start</div>
  </div>

  <div class="overlay-msg" id="msg"></div>
  <div style="margin-top:14px;">
    <button class="btn" id="startBtn">Start</button>
  </div>
</div>

<script>
const pads = [0,1,2,3].map(i => document.getElementById('pad'+i));
const roundEl = document.getElementById('round');
const bestEl = document.getElementById('best');
const msgEl = document.getElementById('msg');
const centerEl = document.getElementById('center');
const startBtn = document.getElementById('startBtn');

let best = Number(localStorage.getItem('simon-best') || 0);
bestEl.textContent = best;

const FREQS = [220, 277, 330, 392];
let audioCtx;
function beep(i, duration=300) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.frequency.value = FREQS[i];
    osc.type = 'sine';
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration/1000);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration/1000);
  } catch (e) {}
}

let sequence = [], playerStep = 0, accepting = false, playing = false;

function reset() {
  sequence = [];
  playerStep = 0;
  accepting = false;
  playing = false;
  roundEl.textContent = 0;
  msgEl.textContent = '';
  msgEl.className = 'overlay-msg';
  centerEl.textContent = 'Get ready…';
  setTimeout(nextRound, 700);
}

function nextRound() {
  sequence.push(Math.floor(Math.random()*4));
  playerStep = 0;
  roundEl.textContent = sequence.length;
  centerEl.textContent = 'Watch…';
  playSequence();
}

function flashPad(i, duration=400) {
  return new Promise(resolve => {
    pads[i].classList.add('active');
    beep(i, duration);
    setTimeout(() => { pads[i].classList.remove('active'); resolve(); }, duration);
  });
}

async function playSequence() {
  accepting = false;
  playing = true;
  await new Promise(r => setTimeout(r, 400));
  const speed = Math.max(220, 420 - sequence.length * 10);
  for (const i of sequence) {
    await flashPad(i, speed * 0.7);
    await new Promise(r => setTimeout(r, speed * 0.3));
  }
  playing = false;
  accepting = true;
  centerEl.textContent = 'Your turn';
}

function padClick(i) {
  if (!accepting || playing) return;
  flashPad(i, 220);
  if (i === sequence[playerStep]) {
    playerStep++;
    if (playerStep === sequence.length) {
      accepting = false;
      centerEl.textContent = 'Nice! Next round…';
      setTimeout(nextRound, 800);
    }
  } else {
    accepting = false;
    playing = false;
    if (sequence.length - 1 > best) {
      best = sequence.length - 1;
      localStorage.setItem('simon-best', best);
      bestEl.textContent = best;
    }
    centerEl.textContent = 'Tap Start';
    msgEl.textContent = `Wrong! You reached round ${sequence.length}. Tap Start to retry`;
    msgEl.className = 'overlay-msg bad';
  }
}

pads.forEach((p, i) => {
  p.addEventListener('click', () => padClick(i));
});

document.addEventListener('keydown', e => {
  const map = { '1':0, '2':1, '3':2, '4':3 };
  if (map[e.key] !== undefined) padClick(map[e.key]);
});

startBtn.addEventListener('click', reset);
</script>
</body>
</html>
