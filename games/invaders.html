<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8E%AE%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#0f1220">
<title>Space Invaders — Arcade Hub</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  .inv-controls {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 18px;
  }
  .inv-controls button {
    width: 70px; height: 56px;
    font-size: 1.3rem;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.1);
    background: var(--card);
    color: var(--text);
    cursor: pointer;
  }
  .inv-controls button:active { background: var(--card-hover); }
</style>
</head>
<body>

<header class="site-header">
  <div class="brand"><span class="dot"></span> Arcade Hub</div>
  <a class="home-link" href="../index.html">← All games</a>
</header>

<div class="game-wrap">
  <h1>👾 Space Invaders</h1>
  <p class="hint">Arrow keys / A-D to move, Space to shoot · on mobile use the buttons below</p>

  <div class="hud">
    <div class="pill">Score <span id="score">0</span></div>
    <div class="pill">Lives <span id="lives">3</span></div>
    <div class="pill">Best <span id="best">0</span></div>
  </div>

  <div class="stage">
    <canvas id="board" width="420" height="480"></canvas>
  </div>

  <div class="overlay-msg" id="msg">Tap the board or press Space to start</div>

  <div class="inv-controls">
    <button id="leftBtn">◀</button>
    <button id="fireBtn">🔥</button>
    <button id="rightBtn">▶</button>
  </div>
</div>

<script>
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');
const bestEl = document.getElementById('best');
const msgEl = document.getElementById('msg');

let best = Number(localStorage.getItem('invaders-best') || 0);
bestEl.textContent = best;

const PLAYER_W = 34, PLAYER_H = 16;
let player, bullets, enemyBullets, enemies, score, lives, running, started, dir, enemySpeed, moveTimer, enemyFrame;

const STARS = Array.from({ length: 60 }, () => ({
  x: Math.random() * W,
  y: Math.random() * H,
  r: Math.random() * 1.5 + 0.3,
  phase: Math.random() * Math.PI * 2,
}));

const ALIEN_SPRITES = {
  0: [
    ['00111100','01111110','11011011','11111111','10100101','01000010'],
    ['00111100','01111110','11011011','11111111','01000010','10100101'],
  ],
  1: [
    ['00100100','01111110','11011011','11111111','01111110','00100100'],
    ['00100100','01111110','11011011','11111111','10111101','01000010'],
  ],
};
const ALIEN_COLORS = ['#4ade80', '#22d3ee'];

function drawAlien(en) {
  const frames = ALIEN_SPRITES[en.variant];
  const rows = frames[enemyFrame % frames.length];
  const cw = en.w / 8, ch = en.h / rows.length;
  ctx.fillStyle = ALIEN_COLORS[en.variant];
  for (let r = 0; r < rows.length; r++) {
    for (let c = 0; c < 8; c++) {
      if (rows[r][c] === '1') ctx.fillRect(en.x + c*cw, en.y + r*ch, cw + 0.6, ch + 0.6);
    }
  }
}

function reset() {
  player = { x: W/2 - PLAYER_W/2, y: H - 40 };
  bullets = [];
  enemyBullets = [];
  score = 0;
  lives = 3;
  running = true;
  started = false;
  dir = 1;
  enemySpeed = 14;
  moveTimer = 0;
  enemyFrame = 0;
  scoreEl.textContent = score;
  livesEl.textContent = lives;
  msgEl.textContent = 'Tap the board or press Space to start';
  msgEl.className = 'overlay-msg';
  spawnWave();
}

function spawnWave() {
  enemies = [];
  const rows = 4, cols = 8;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      enemies.push({ x: 30 + c*44, y: 40 + r*40, w: 28, h: 20, alive: true, variant: r % 2 });
    }
  }
}

function start() {
  if (started || !running) return;
  started = true;
  msgEl.textContent = '';
}

canvas.addEventListener('mousedown', start);
canvas.addEventListener('touchstart', e => { e.preventDefault(); start(); fire(); }, { passive: false });

const keys = {};
document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ') { e.preventDefault(); start(); fire(); }
  if (e.key.startsWith('Arrow')) e.preventDefault();
});
document.addEventListener('keyup', e => keys[e.key] = false);

function bindHold(el, onDown) {
  let interval;
  const startHold = e => { e.preventDefault(); onDown(); interval = setInterval(onDown, 60); };
  const stopHold = () => clearInterval(interval);
  el.addEventListener('mousedown', startHold);
  el.addEventListener('touchstart', startHold, { passive: false });
  el.addEventListener('mouseup', stopHold);
  el.addEventListener('mouseleave', stopHold);
  el.addEventListener('touchend', stopHold);
}

bindHold(document.getElementById('leftBtn'), () => { player.x = Math.max(player.x - 8, 0); });
bindHold(document.getElementById('rightBtn'), () => { player.x = Math.min(player.x + 8, W - PLAYER_W); });
document.getElementById('fireBtn').addEventListener('click', () => { start(); fire(); });
document.getElementById('fireBtn').addEventListener('touchstart', e => { e.preventDefault(); start(); fire(); }, { passive: false });

let lastShot = 0;
function fire() {
  if (!running || !started) return;
  const now = performance.now();
  if (now - lastShot < 320) return;
  lastShot = now;
  bullets.push({ x: player.x + PLAYER_W/2 - 2, y: player.y, w: 4, h: 10 });
}

function update() {
  if (!running || !started) return;

  if (keys.ArrowLeft || keys.a) player.x = Math.max(player.x - 5, 0);
  if (keys.ArrowRight || keys.d) player.x = Math.min(player.x + 5, W - PLAYER_W);

  bullets.forEach(b => b.y -= 7);
  bullets = bullets.filter(b => b.y > -10);

  enemyBullets.forEach(b => b.y += 4);
  enemyBullets = enemyBullets.filter(b => b.y < H + 10);

  moveTimer++;
  if (moveTimer > enemySpeed) {
    moveTimer = 0;
    enemyFrame = 1 - enemyFrame;
    let hitEdge = false;
    enemies.forEach(en => {
      if (!en.alive) return;
      en.x += dir * 10;
      if (en.x < 10 || en.x + en.w > W - 10) hitEdge = true;
    });
    if (hitEdge) {
      dir *= -1;
      enemies.forEach(en => en.y += 16);
      enemySpeed = Math.max(4, enemySpeed - 1);
    }
    if (Math.random() < 0.5) {
      const alive = enemies.filter(e => e.alive);
      if (alive.length) {
        const shooter = alive[Math.floor(Math.random()*alive.length)];
        enemyBullets.push({ x: shooter.x + shooter.w/2 - 2, y: shooter.y + shooter.h, w: 4, h: 10 });
      }
    }
  }

  for (const b of bullets) {
    for (const en of enemies) {
      if (!en.alive) continue;
      if (b.x < en.x + en.w && b.x + b.w > en.x && b.y < en.y + en.h && b.y + b.h > en.y) {
        en.alive = false;
        b.y = -100;
        score += 10;
        scoreEl.textContent = score;
      }
    }
  }
  bullets = bullets.filter(b => b.y > -50);

  for (const b of enemyBullets) {
    if (b.x < player.x + PLAYER_W && b.x + b.w > player.x && b.y < player.y + PLAYER_H && b.y + b.h > player.y) {
      b.y = H + 100;
      hitPlayer();
    }
  }

  if (enemies.some(en => en.alive && en.y + en.h > player.y)) return gameOver();

  if (enemies.every(en => !en.alive)) {
    score += 50;
    scoreEl.textContent = score;
    enemySpeed = 14;
    spawnWave();
  }
}

function hitPlayer() {
  lives--;
  livesEl.textContent = lives;
  if (lives <= 0) gameOver();
}

function gameOver() {
  running = false;
  if (score > best) { best = score; localStorage.setItem('invaders-best', best); bestEl.textContent = best; }
  msgEl.textContent = 'Game Over — tap the board to retry';
  msgEl.className = 'overlay-msg bad';
  setTimeout(() => { canvas.addEventListener('touchstart', restartOnce, { passive: true }); canvas.addEventListener('mousedown', restartOnce); }, 300);
}

function restartOnce() {
  canvas.removeEventListener('touchstart', restartOnce);
  canvas.removeEventListener('mousedown', restartOnce);
  reset();
}

function drawBackground(t) {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#0d1030');
  grad.addColorStop(1, '#0b0e1c');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  const nebula = ctx.createRadialGradient(W*0.7, H*0.2, 0, W*0.7, H*0.2, W*0.6);
  nebula.addColorStop(0, 'rgba(124,92,255,0.12)');
  nebula.addColorStop(1, 'rgba(124,92,255,0)');
  ctx.fillStyle = nebula;
  ctx.fillRect(0, 0, W, H);

  STARS.forEach(s => {
    const a = 0.3 + 0.6 * Math.abs(Math.sin(t / 700 + s.phase));
    ctx.fillStyle = `rgba(238,240,255,${a.toFixed(2)})`;
    ctx.fillRect(s.x, s.y, s.r, s.r);
  });
}

function drawShip() {
  const cx = player.x + PLAYER_W/2, cy = player.y + PLAYER_H/2;
  ctx.save();
  ctx.translate(cx, cy);

  const flicker = 4 + Math.sin(performance.now() / 60) * 3;
  ctx.fillStyle = `rgba(124,92,255,${0.5 + Math.random()*0.2})`;
  ctx.beginPath();
  ctx.moveTo(-5, PLAYER_H/2);
  ctx.lineTo(5, PLAYER_H/2);
  ctx.lineTo(0, PLAYER_H/2 + flicker);
  ctx.closePath();
  ctx.fill();

  const grad = ctx.createLinearGradient(0, -PLAYER_H/2 - 8, 0, PLAYER_H/2);
  grad.addColorStop(0, '#7dfcff');
  grad.addColorStop(1, '#1a9bb0');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(0, -PLAYER_H/2 - 8);
  ctx.lineTo(PLAYER_W/2, PLAYER_H/2);
  ctx.lineTo(PLAYER_W/2 - 6, PLAYER_H/2);
  ctx.lineTo(0, PLAYER_H/2 - 4);
  ctx.lineTo(-(PLAYER_W/2 - 6), PLAYER_H/2);
  ctx.lineTo(-PLAYER_W/2, PLAYER_H/2);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#0b0e1c';
  ctx.beginPath();
  ctx.arc(0, -2, 3.4, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function draw() {
  const t = performance.now();
  drawBackground(t);

  drawShip();

  ctx.fillStyle = '#eef0ff';
  bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));
  ctx.fillStyle = '#f87171';
  enemyBullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

  enemies.forEach(en => { if (en.alive) drawAlien(en); });
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

reset();
loop();
</script>
</body>
</html>
