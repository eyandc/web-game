<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8E%AE%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#0f1220">
<title>Flappy Bird — Arcade Hub</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header class="site-header">
  <div class="brand"><span class="dot"></span> Arcade Hub</div>
  <a class="home-link" href="../index.html">← All games</a>
</header>

<div class="game-wrap">
  <h1>🐤 Flappy Bird</h1>
  <p class="hint">Tap, click, or press Space to flap</p>

  <div class="hud">
    <div class="pill">Score <span id="score">0</span></div>
    <div class="pill">Best <span id="best">0</span></div>
  </div>

  <div class="stage">
    <canvas id="board" width="360" height="520"></canvas>
  </div>

  <div class="overlay-msg" id="msg">Tap the board to start</div>
</div>

<script>
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const msgEl = document.getElementById('msg');

let best = Number(localStorage.getItem('flappy-best') || 0);
bestEl.textContent = best;

const GRAVITY = 0.45;
const FLAP = -7.5;
const PIPE_GAP = 150;
const PIPE_W = 56;
const PIPE_SPEED = 2.6;
const GROUND_H = 16;
const GROUND_Y = H - GROUND_H;

let bird, pipes, score, running, started;

const STARS = Array.from({ length: 40 }, () => ({
  x: Math.random() * W,
  y: Math.random() * (H * 0.6),
  r: Math.random() * 1.6 + 0.4,
  phase: Math.random() * Math.PI * 2,
}));
const CLOUDS = Array.from({ length: 4 }, (_, i) => ({
  x: (i / 4) * W + Math.random() * 80,
  y: 30 + Math.random() * 90,
  scale: 0.7 + Math.random() * 0.7,
}));
let groundOffset = 0;

function reset() {
  bird = { x: 70, y: H/2, r: 14, vy: 0 };
  pipes = [];
  score = 0;
  running = true;
  started = false;
  scoreEl.textContent = score;
  msgEl.textContent = 'Tap the board to start';
  msgEl.className = 'overlay-msg';
  spawnPipe(W + 100);
}

function spawnPipe(x) {
  const margin = 60;
  const gapY = margin + Math.random() * (H - margin*2 - PIPE_GAP);
  pipes.push({ x, gapY, passed: false });
}

function flap() {
  if (!running) { reset(); return; }
  started = true;
  bird.vy = FLAP;
  msgEl.textContent = '';
}

canvas.addEventListener('mousedown', flap);
canvas.addEventListener('touchstart', e => { e.preventDefault(); flap(); }, { passive: false });
document.addEventListener('keydown', e => { if (e.key === ' ') { e.preventDefault(); flap(); } });

function update() {
  groundOffset = (groundOffset + (started && running ? PIPE_SPEED : 0)) % 24;
  if (started && running) {
    CLOUDS.forEach(c => {
      c.x -= PIPE_SPEED * 0.25;
      if (c.x < -60) c.x = W + 60;
    });
  }

  if (!running || !started) return;

  bird.vy += GRAVITY;
  bird.y += bird.vy;

  pipes.forEach(p => p.x -= PIPE_SPEED);
  if (pipes.length && pipes[0].x < -PIPE_W) pipes.shift();
  if (pipes.length && pipes[pipes.length-1].x < W - 200) spawnPipe(W + 20);

  for (const p of pipes) {
    if (!p.passed && p.x + PIPE_W < bird.x) {
      p.passed = true;
      score++;
      scoreEl.textContent = score;
    }
    const withinX = bird.x + bird.r > p.x && bird.x - bird.r < p.x + PIPE_W;
    const hitTop = bird.y - bird.r < p.gapY;
    const hitBottom = bird.y + bird.r > p.gapY + PIPE_GAP;
    if (withinX && (hitTop || hitBottom)) return die();
  }

  if (bird.y + bird.r > GROUND_Y || bird.y - bird.r < 0) return die();
}

function die() {
  running = false;
  if (score > best) { best = score; localStorage.setItem('flappy-best', best); bestEl.textContent = best; }
  msgEl.textContent = `Game Over — score ${score}. Tap to retry`;
  msgEl.className = 'overlay-msg bad';
}

function drawBackground(t) {
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#141a3d');
  sky.addColorStop(0.6, '#1c2452');
  sky.addColorStop(1, '#2a2f5c');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  STARS.forEach(s => {
    const a = 0.4 + 0.5 * Math.sin(t / 600 + s.phase);
    ctx.fillStyle = `rgba(238,240,255,${Math.max(0, a).toFixed(2)})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  });

  CLOUDS.forEach(c => {
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.scale(c.scale, c.scale);
    ctx.fillStyle = 'rgba(238,240,255,0.14)';
    [[0,0,22],[18,-6,16],[-18,-4,15],[0,-14,16]].forEach(([dx,dy,r]) => {
      ctx.beginPath(); ctx.arc(dx, dy, r, 0, Math.PI*2); ctx.fill();
    });
    ctx.restore();
  });
}

function drawGround() {
  ctx.fillStyle = '#20264a';
  ctx.fillRect(0, GROUND_Y, W, GROUND_H);
  ctx.fillStyle = 'rgba(238,240,255,0.12)';
  for (let x = -24 + (-groundOffset % 24); x < W; x += 24) {
    ctx.fillRect(x, GROUND_Y, 12, GROUND_H);
  }
  ctx.fillStyle = '#4ade80';
  ctx.fillRect(0, GROUND_Y, W, 4);
}

function drawPipes() {
  pipes.forEach(p => {
    const grad = ctx.createLinearGradient(p.x, 0, p.x + PIPE_W, 0);
    grad.addColorStop(0, '#3fae6d');
    grad.addColorStop(0.5, '#4ade80');
    grad.addColorStop(1, '#3fae6d');
    ctx.fillStyle = grad;
    ctx.fillRect(p.x, 0, PIPE_W, p.gapY);
    ctx.fillRect(p.x, p.gapY + PIPE_GAP, PIPE_W, GROUND_Y - (p.gapY + PIPE_GAP));
    ctx.fillStyle = '#2f8a56';
    ctx.fillRect(p.x - 4, p.gapY - 18, PIPE_W + 8, 18);
    ctx.fillRect(p.x - 4, p.gapY + PIPE_GAP, PIPE_W + 8, 18);
  });
}

function drawBird(t) {
  ctx.save();
  ctx.translate(bird.x, bird.y);
  const angle = Math.max(-0.5, Math.min(1, bird.vy / 10));
  ctx.rotate(angle);

  const wing = Math.sin(t / 70) * 0.7;

  // tail
  ctx.fillStyle = '#f97316';
  ctx.beginPath();
  ctx.moveTo(-bird.r + 2, 0);
  ctx.lineTo(-bird.r - 8, -6);
  ctx.lineTo(-bird.r - 8, 6);
  ctx.closePath();
  ctx.fill();

  // body
  const bodyGrad = ctx.createRadialGradient(-4, -4, 2, 0, 0, bird.r + 2);
  bodyGrad.addColorStop(0, '#fde047');
  bodyGrad.addColorStop(1, '#f59e0b');
  ctx.fillStyle = bodyGrad;
  ctx.beginPath();
  ctx.ellipse(0, 0, bird.r, bird.r * 0.85, 0, 0, Math.PI * 2);
  ctx.fill();

  // wing
  ctx.save();
  ctx.translate(-2, 2);
  ctx.rotate(wing);
  ctx.fillStyle = '#ea9c1f';
  ctx.beginPath();
  ctx.ellipse(0, 0, bird.r * 0.6, bird.r * 0.32, 0.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // beak
  ctx.fillStyle = '#f97316';
  ctx.beginPath();
  ctx.moveTo(bird.r - 2, -3);
  ctx.lineTo(bird.r + 9, 1);
  ctx.lineTo(bird.r - 2, 5);
  ctx.closePath();
  ctx.fill();

  // eye
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(5, -5, 4.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath();
  ctx.arc(6.4, -5, 2.1, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function draw() {
  const t = performance.now();
  drawBackground(t);
  drawPipes();
  drawGround();
  drawBird(t);

  if (!started && running) {
    ctx.fillStyle = 'rgba(238,240,255,0.7)';
    ctx.font = '14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Tap / Click / Space to flap', W/2, H/2 + 40);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

reset();
loop();
</script>
</body>
</html>
